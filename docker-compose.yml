# One command to run everything: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: briefboard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/briefboard
      JWT_SECRET: change-me-in-production
      WEB_ORIGIN: http://localhost:3000
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000 # the browser calls the API directly
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
